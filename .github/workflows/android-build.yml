name: Build NX2 Android

on:
  workflow_dispatch:
    inputs:
      inspect:
        description: "Debug: shell commands run in the upstream tree; output is published as annotations"
        required: false
        default: ""
      skip_build:
        description: "Debug: skip the APK build (only run the inspect job)"
        type: boolean
        default: false
  push:
    branches: [ main, fix/embedded-switch2-npdm, claude/lichii-test ]
    paths:
      - ".github/workflows/android-build.yml"
      - "patches/**"
      - "scripts/**"
      - "android_overlay/**"
      - "README.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  inspect-upstream:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run inspection commands
        shell: bash
        env:
          INSPECT: ${{ inputs.inspect }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Source inspection needs no submodules. Clone errors are published too,
          # since logs are not readable from every debugging environment.
          W="$GITHUB_WORKSPACE"
          ok=0
          for try in 1 2 3; do
            rm -rf "$W/upstream"
            if git clone --branch nx2 --single-branch \
                https://github.com/zortos293/Eglantine.git "$W/upstream" >> "$W/clone.log" 2>&1; then
              ok=1; break
            fi
            sleep 15
          done
          if [ "$ok" = 1 ] && ! git -C "$W/upstream" checkout -q 9a435b5 >> "$W/clone.log" 2>&1; then
            echo "pinned commit missing; inspecting branch HEAD" >> "$W/clone.log"
          fi
          if [ "$ok" = 1 ]; then
            (cd "$W/upstream" && bash -c "$INSPECT") > "$W/inspect.txt" 2>&1 || true
          else
            {
              echo "CLONE FAILED"
              cat "$W/clone.log"
              echo "== curl upload-pack"
              curl -sS -o /dev/null -w "%{http_code} %{url_effective}\n" -L \
                "https://git.eden-emu.dev/moceure/eden-nx2-android.git/info/refs?service=git-upload-pack" 2>&1
              echo "== curl headers"
              curl -sS -I https://git.eden-emu.dev/ 2>&1 | head -20
            } > "$W/inspect.txt"
          fi
          mkdir -p "$W/out" && cp "$W/inspect.txt" "$W/out/" && cd "$W/out"
          git init -q && git checkout -q -b inspect-output
          git add inspect.txt
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -qm "inspect output for run ${GITHUB_RUN_ID}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" inspect-output:refs/heads/ci/inspect-output
          echo "::notice title=inspect-done::run ${GITHUB_RUN_ID}, $(wc -c < inspect.txt) bytes on ci/inspect-output"

  android-arm64:
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Clone Lichii nx2 base (test branch)
        shell: bash
        run: |
          # Lichii is zortos293's continuation of Eglantine nx2 (9a435b5 is an ancestor).
          git clone --recursive --branch nx2 --single-branch \
            https://github.com/zortos293/Lichii.git upstream
          git -C upstream checkout 5f6066b26
          # Ocarina's 1080p upscaler and shadow gathers (fix/oot-upscaler-gathers, not in nx2 yet).
          git -C upstream fetch -q origin fix/oot-upscaler-gathers
          git -C upstream -c user.name=ci -c user.email=ci@localhost \
            cherry-pick -X theirs df07b16ee 6a7953411 97b32079c 7459f10f1
          git -C upstream submodule update --init --recursive
          echo "NX2_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "NX2_UPSTREAM=zortos293/Lichii:nx2@5f6066b+oot-upscaler-gathers" >> "$GITHUB_ENV"
          git -C upstream log -1 --oneline

      - name: Install host build tools
        shell: bash
        run: |
          # glslangValidator compiles Eden's host shaders at configure time.
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools ccache
          glslangValidator --version | head -n1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream/src/android/**/*.gradle*

      - name: Configure NX2 Android fork
        shell: bash
        run: |
          python3 scripts/configure-lichii.py upstream "build-${{ github.run_number }}"
          grep -n 'LICHII_BUILD' upstream/src/android/app/build.gradle.kts
          grep -n 'AUTO_UPDATE' upstream/CMakeModules/GenerateSCMRev.cmake

      - name: Restore Android loose ExeFS discovery (tolerant)
        shell: bash
        run: |
          python3 scripts/apply-eglantine-switch2-regressions-tolerant.py upstream | tee regressions.log
          grep NX2_PATCH_SKIP regressions.log | sed 's/^/::warning title=patch-skip::/' || true

      - name: Enable direct ExeFS Android folder launch
        shell: bash
        run: |
          python3 -m py_compile scripts/apply-nx2-direct-exefs.py
          python3 scripts/apply-nx2-direct-exefs.py upstream
          grep -n 'Launch ExeFS game folder' upstream/src/android/app/src/main/res/values/strings.xml
          grep -n 'showAddDirectoryMenu(binding.addDirectory)' upstream/src/android/app/src/main/java/org/yuzu/yuzu_emu/ui/GamesFragment.kt
          grep -n 'NX2_LOOSE_ROMFS mode=base+update' upstream/src/core/loader/deconstructed_rom_directory.cpp

      - name: Decode prefixed ZBIC NSO frames and add content diagnostics
        shell: bash
        run: python3 scripts/apply-nx2-content-guards.py upstream

      - name: Android memory-map budget (GPU-only regions, NX2_MAPS log)
        shell: bash
        run: python3 scripts/apply-android-map-budget.py upstream

      - name: Android heap tracker map budget
        shell: bash
        run: python3 scripts/apply-android-heap-tracker-budget.py upstream

      - name: Android libc++ atomic_ref compatibility
        shell: bash
        run: python3 scripts/apply-android-atomic-ref-compat.py upstream

      - name: Android libc++ int64/long long compatibility
        shell: bash
        run: python3 scripts/apply-android-int64-compat.py upstream

      - name: Host crash location report (NX2_FAULT)
        shell: bash
        run: python3 scripts/apply-nx2-fault-report.py upstream

      - name: Android mimalloc for operator new/delete
        shell: bash
        run: python3 scripts/apply-android-mimalloc.py upstream

      - name: Fastmem mapping diagnostics (NX2_HOSTMEM)
        shell: bash
        run: python3 scripts/apply-nx2-hostmem-diag.py upstream

      - name: Guest thread dump when presentation stops (NX2_HANG)
        shell: bash
        run: python3 scripts/apply-nx2-hang-watchdog.py upstream

      - name: Live guest PC sampling for hang dumps
        shell: bash
        run: python3 scripts/apply-nx2-hang-sample.py upstream

      - name: nx2_switches.txt loader and NX2_GPU load logging
        shell: bash
        run: python3 scripts/apply-nx2-switches-and-gpu-stats.py upstream

      - name: GPU-thread profiler on (test builds)
        if: github.ref_name != 'main'
        shell: bash
        run: python3 scripts/apply-nx2-gpu-profile-on.py upstream

      - name: Software HMMA through workgroup memory (Turnip)
        shell: bash
        run: python3 scripts/apply-nx2-hmma-lds.py upstream

      - name: Skip the DLSS network when the replacement upscale draws
        shell: bash
        run: python3 scripts/apply-nx2-dlss-skip-network.py upstream

      - name: Profile GPU waits by call site
        if: github.ref_name != 'main'
        shell: bash
        run: python3 scripts/apply-nx2-finish-sites.py upstream

      - name: Host-mapped buffer cache buffers on Adreno (unified memory)
        shell: bash
        run: python3 scripts/apply-nx2-mapped-buffers.py upstream

      - name: Mapped buffer reads wait for the last GPU write
        shell: bash
        run: python3 scripts/apply-nx2-download-write-tick.py upstream

      - name: Video decoder trace on (test builds)
        if: github.ref_name != 'main'
        shell: bash
        run: python3 scripts/apply-nx2-vdec-trace-on.py upstream

      - name: NCE unmapped accesses behave as on Dynarmic
        shell: bash
        run: python3 scripts/apply-nce-unmapped-access.py upstream

      - name: Detect Android build requirements
        id: android_req
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          NDK_VERSION="$(grep -RhoE 'ndkVersion[[:space:]]*=[[:space:]]*"[^"]+"' upstream/src/android 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          if [ -n "$NDK_VERSION" ]; then
            echo "Detected NDK: $NDK_VERSION"
            echo "ndk_version=$NDK_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "No explicit NDK version detected; Gradle/SDK defaults will be used."
            echo "ndk_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install requested Android NDK
        if: steps.android_req.outputs.ndk_version != ''
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ steps.android_req.outputs.ndk_version }}"

      - name: Build FFmpeg with dav1d (AV1) for Android
        shell: bash
        run: |
          ANDROID_NDK_DIR="$ANDROID_SDK_ROOT/ndk/${{ steps.android_req.outputs.ndk_version }}" \
            bash scripts/build-android-ffmpeg-av1.sh "$GITHUB_WORKSPACE/ffmpeg-android"
          python3 scripts/apply-android-ffmpeg-av1.py upstream "$GITHUB_WORKSPACE/ffmpeg-android"

      - name: Prepare Gradle
        shell: bash
        working-directory: upstream/src/android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew tasks --all > "$GITHUB_WORKSPACE/gradle-tasks.txt"
          grep -E "assemble.*(Standard|Release|Debug)" "$GITHUB_WORKSPACE/gradle-tasks.txt" | head -n 80 || true

      - name: Kotlin compile preflight
        shell: bash
        working-directory: upstream/src/android
        run: |
          set -o pipefail
          # CMake configure stages SDL's Java sources into externals/generated/sdl/java.
          # It is fast compared with the full 1,700+ object native build.
          ./gradlew 'app:configureCMakeRelWithDebInfo[arm64-v8a]' --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"
          ./gradlew app:compileMainlineReleaseKotlin --stacktrace --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/android-build.log"

      - name: Build standard ARM64 APK
        shell: bash
        working-directory: upstream/src/android
        run: |
          set -o pipefail
          TASKS="$(cat "$GITHUB_WORKSPACE/gradle-tasks.txt")"

          if grep -q "^app:assembleMainlineRelease" <<< "$TASKS"; then
            BUILD_TASK=app:assembleMainlineRelease
          elif grep -q "^app:assembleMainlineDebug" <<< "$TASKS"; then
            BUILD_TASK=app:assembleMainlineDebug
          elif grep -q "^app:assembleRelease" <<< "$TASKS"; then
            BUILD_TASK=app:assembleRelease
          elif grep -q "^app:assembleDebug" <<< "$TASKS"; then
            BUILD_TASK=app:assembleDebug
          else
            echo "Could not identify an Android assemble task."
            grep -E "assemble(Mainline|Release|Debug)" "$GITHUB_WORKSPACE/gradle-tasks.txt" | head -n 120 || true
            exit 2
          fi

          echo "Using Gradle task: $BUILD_TASK"
          echo "BUILD_TASK=$BUILD_TASK" >> "$GITHUB_ENV"
          ./gradlew "$BUILD_TASK" --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/android-build.log"

      - name: Surface build errors as annotations
        if: failure()
        shell: bash
        run: |
          # Annotations are readable through the GitHub API even when log/artifact
          # downloads are not, so mirror the key failure lines here.
          set +e +o pipefail
          LOG="$GITHUB_WORKSPACE/android-build.log"
          [ -f "$LOG" ] || { echo "::error title=no-build-log::android-build.log was not produced"; exit 0; }
          emit() {
            # $1 = title, stdin = text; GitHub annotations need %, CR, LF escaped
            local body
            body="$(cat | head -c 60000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"}{print}')"
            [ -n "$body" ] && echo "::error title=$1::$body"
          }
          (grep -nE "error:|Error:|FAILED|What went wrong|CMake Error|undefined reference|fatal error|> Task .* FAILED|Could not|not found" "$LOG" || true) | head -n 150 | emit build-errors
          (grep -nA40 "What went wrong" "$LOG" || true) | head -n 120 | emit what-went-wrong
          (grep -nB5 -A25 "CMake Error" "$LOG" || true) | head -n 150 | emit cmake-error
          grep -nE "^e: |^w: .*error" "$LOG" | head -n 60 | emit kotlin-errors
          tail -n 120 "$LOG" | emit log-tail

      - name: Collect build metadata
        if: always()
        shell: bash
        run: |
          {
            echo "NX2 upstream: ${NX2_UPSTREAM:-unknown}"
            echo "NX2 source commit: ${NX2_COMMIT:-unknown}"
            echo "Gradle task: ${BUILD_TASK:-not-started}"
            echo "Runner: $RUNNER_OS / $RUNNER_ARCH"
            echo
            echo "APKs:"
            find upstream/src/android -type f -name "*.apk" -print 2>/dev/null || true
          } > build-info.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eden-nx2-android-arm64-${{ github.run_number }}
          path: |
            upstream/src/android/**/*.apk
            build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish test pre-release (not marked latest)
        if: success() && github.ref_name == 'claude/lichii-test'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find upstream/src/android -type f -name '*.apk' | head -n1)"
          mkdir -p dist && cp "$apk" "dist/Eden-NX2-Android-lichii-test-${{ github.run_number }}.apk"
          cp build-info.txt dist/
          TAG="lichii-test-${{ github.run_number }}"
          gh release delete "$TAG" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Lichii nx2 test ${{ github.run_number }}" \
            --notes "Test build on zortos293/Lichii nx2 (${NX2_COMMIT:0:9}) with this fork's patches. Pre-release; main stays on Eglantine. No keys, firmware or games included."

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-nx2-build-diagnostics-${{ github.run_number }}
          path: |
            android-build.log
            gradle-tasks.txt
            build-info.txt
          if-no-files-found: ignore
          retention-days: 14
