name: Build Current Eden-NS2 Android Experiment

on:
  workflow_dispatch:
  push:
    branches: [ experiment/eden-ns2-current-android ]
    paths:
      - ".github/workflows/android-eden-ns2-current.yml"

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Clone current Eden-NS2
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/969981/Eden-NS2.git upstream
          git -C upstream checkout 78d8f4e6fba8433ff56ae118a394e9ce2ae6cccf
          git -C upstream submodule update --init --recursive
          echo "NX2_SOURCE=969981/Eden-NS2" >> "$GITHUB_ENV"
          echo "NX2_COMMIT=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
          git -C upstream log -1 --oneline

      - name: Install host build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools ccache
          glslangValidator --version | head -n1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream/src/android/**/*.gradle*

      - name: Detect and install Android SDK requirements
        id: android_req
        shell: bash
        run: |
          set -euxo pipefail
          NDK_VERSION="$(grep -RhoE 'ndkVersion[[:space:]]*=[[:space:]]*"[^"]+"' upstream/src/android 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          CMAKE_VERSION="$(grep -RhoE 'version[[:space:]]*=[[:space:]]*"3\.[0-9]+\.[0-9]+"' upstream/src/android/app/build.gradle.kts 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          echo "Detected NDK: $NDK_VERSION"
          echo "Detected CMake: $CMAKE_VERSION"
          if [ -n "$NDK_VERSION" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          if [ -n "$CMAKE_VERSION" ]; then
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "cmake;$CMAKE_VERSION"
          fi
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare Gradle
        shell: bash
        working-directory: upstream/src/android
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --version
          ./gradlew tasks --all > "$GITHUB_WORKSPACE/gradle-tasks-ns2.txt"
          grep -E "assemble.*(Mainline|Release|Debug)" "$GITHUB_WORKSPACE/gradle-tasks-ns2.txt" | head -n 80 || true

      - name: Kotlin/native configure preflight
        shell: bash
        working-directory: upstream/src/android
        run: |
          set -o pipefail
          ./gradlew 'app:configureCMakeRelWithDebInfo[arm64-v8a]' --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/eden-ns2-android-build.log"
          ./gradlew app:compileMainlineReleaseKotlin --stacktrace --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/eden-ns2-android-build.log"

      - name: Build current Eden-NS2 ARM64 APK
        shell: bash
        working-directory: upstream/src/android
        run: |
          set -o pipefail
          TASKS="$(cat "$GITHUB_WORKSPACE/gradle-tasks-ns2.txt")"
          if grep -q "^app:assembleMainlineRelease" <<< "$TASKS"; then
            BUILD_TASK=app:assembleMainlineRelease
          elif grep -q "^app:assembleMainlineDebug" <<< "$TASKS"; then
            BUILD_TASK=app:assembleMainlineDebug
          elif grep -q "^app:assembleRelease" <<< "$TASKS"; then
            BUILD_TASK=app:assembleRelease
          else
            BUILD_TASK=app:assembleDebug
          fi
          echo "BUILD_TASK=$BUILD_TASK" >> "$GITHUB_ENV"
          ./gradlew "$BUILD_TASK" --stacktrace --no-daemon 2>&1 | tee -a "$GITHUB_WORKSPACE/eden-ns2-android-build.log"

      - name: Collect build metadata
        if: always()
        shell: bash
        run: |
          {
            echo "Source: ${NX2_SOURCE:-unknown}"
            echo "Commit: ${NX2_COMMIT:-unknown}"
            echo "Gradle task: ${BUILD_TASK:-not-started}"
            echo
            echo "APKs:"
            find upstream/src/android -type f -name "*.apk" -print 2>/dev/null || true
          } > eden-ns2-current-build-info.txt

      - name: Upload current Eden-NS2 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eden-ns2-current-android-${{ github.run_number }}
          path: |
            upstream/src/android/**/*.apk
            eden-ns2-current-build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-ns2-current-diagnostics-${{ github.run_number }}
          path: |
            eden-ns2-android-build.log
            gradle-tasks-ns2.txt
            eden-ns2-current-build-info.txt
          if-no-files-found: ignore
          retention-days: 14
