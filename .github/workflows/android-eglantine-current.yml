name: Build Current Eglantine NX2 Android Experiment

on:
  workflow_dispatch:
  push:
    branches: [ experiment/eglantine-nx2-current-android ]
    paths:
      - ".github/workflows/android-eglantine-current.yml"

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      EGLANTINE_REPO: zortos293/Eglantine
      EGLANTINE_COMMIT: 3bdd53d08adfd96b7e3e3f09344c514540ef1ce6
      CCACHE: "true"
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm

    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Clone current Eglantine nx2
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/zortos293/Eglantine.git upstream
          git -C upstream checkout "$EGLANTINE_COMMIT"
          git -C upstream submodule update --init --recursive
          git -C upstream log -1 --oneline
          test "$(git -C upstream rev-parse HEAD)" = "$EGLANTINE_COMMIT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: upstream/src/android/**/*.gradle*

      - name: Install Android and host build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools ccache
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;28.2.13676358"             "cmake;3.31.5"
          glslangValidator --version | head -n1
          ccache --version | head -n1

      - name: Cache CPM downloads
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: eglantine-cpm-${{ runner.os }}-${{ hashFiles('upstream/cpmfile.json', 'upstream/CMakeLists.txt', 'upstream/src/**/CMakeLists.txt') }}
          restore-keys: |
            eglantine-cpm-${{ runner.os }}-

      - name: Build Eglantine NX2 Android ARM64
        shell: bash
        working-directory: upstream
        run: |
          set -o pipefail
          chmod +x .ci/android/build.sh
          ./.ci/android/build.sh             --target standard             --build-type RelWithDebInfo             2>&1 | tee "$GITHUB_WORKSPACE/eglantine-android-build.log"

      - name: Collect build metadata
        if: always()
        shell: bash
        run: |
          {
            echo "Source: $EGLANTINE_REPO"
            echo "Commit: $EGLANTINE_COMMIT"
            echo "Branch: nx2"
            echo "Target: standard / Mainline"
            echo "Build type: RelWithDebInfo"
            echo
            echo "APKs:"
            find upstream/artifacts upstream/src/android -type f -name "*.apk" -print 2>/dev/null || true
          } > eglantine-current-build-info.txt

      - name: Upload Eglantine NX2 Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-nx2-current-android-${{ github.run_number }}
          path: |
            upstream/artifacts/*.apk
            eglantine-current-build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-nx2-current-diagnostics-${{ github.run_number }}
          path: |
            eglantine-android-build.log
            eglantine-current-build-info.txt
          if-no-files-found: ignore
          retention-days: 14
