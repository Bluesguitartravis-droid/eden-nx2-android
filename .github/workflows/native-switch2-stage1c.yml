name: Build Switch 2 Stage 1C Controlled Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [ feature/native-switch2-poc ]
    paths:
      - ".github/workflows/native-switch2-stage1c.yml"
      - "native_track/stage1c/**"

permissions:
  contents: read

jobs:
  stage1c:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK pieces
        shell: bash
        run: |
          set -euxo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Pin LZ4 reference decoder
        shell: bash
        run: |
          set -euxo pipefail
          git clone --filter=blob:none --branch v1.10.0 --depth 1 \
            https://github.com/lz4/lz4.git third_party/lz4
          test "$(git -C third_party/lz4 rev-parse HEAD)" = \
            "ebb370ca83af193212df4dcbadcc5d87bc0de2f0"

      - name: Compile Stage 1C native bootstrap
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"

          "$CC" -shared -fPIC -O2 -ffixed-x18 \
            -Wl,-z,max-page-size=16384 \
            -I third_party/lz4/lib \
            native_track/stage1c/native/stage1c_bootstrap.c \
            native_track/stage1c/native/stage1c_entry.S \
            third_party/lz4/lib/lz4.c \
            -o libstage1c.so

          file libstage1c.so
          readelf -h libstage1c.so | grep -E 'Class:|Machine:'

      - name: Compile Java activity and dex
        shell: bash
        run: |
          set -euxo pipefail
          PLATFORM="$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          mkdir -p build/java build/dex
          javac -source 11 -target 11 \
            -classpath "$PLATFORM" \
            -d build/java \
            native_track/stage1c/src/org/nx2a/stage1c/MainActivity.java

          find build/java -name '*.class' -type f -print0 | \
            xargs -0 "$BUILD_TOOLS/d8" \
              --lib "$PLATFORM" \
              --min-api 29 \
              --output build/dex

      - name: Package and sign Stage 1C APK
        shell: bash
        run: |
          set -euxo pipefail
          PLATFORM="$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          "$BUILD_TOOLS/aapt2" link \
            -I "$PLATFORM" \
            --manifest native_track/stage1c/AndroidManifest.xml \
            --min-sdk-version 29 \
            --target-sdk-version 36 \
            --version-code 1 \
            --version-name 0.1 \
            -o build/stage1c-unsigned.apk

          mkdir -p build/apk/lib/arm64-v8a
          cp build/dex/classes.dex build/apk/classes.dex
          cp libstage1c.so build/apk/lib/arm64-v8a/libstage1c.so
          (
            cd build/apk
            zip -q -0 -r ../stage1c-unsigned.apk classes.dex lib
          )

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            build/stage1c-unsigned.apk \
            build/stage1c-aligned.apk

          keytool -genkeypair -noprompt \
            -keystore build/stage1c-debug.jks \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NX2 Stage1C Debug,O=NX2 Research,C=US"

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/stage1c-debug.jks \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out NX2-Switch2-Stage1C-B7-Controlled-Bootstrap.apk \
            build/stage1c-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose \
            NX2-Switch2-Stage1C-B7-Controlled-Bootstrap.apk

          "$BUILD_TOOLS/aapt2" dump badging \
            NX2-Switch2-Stage1C-B7-Controlled-Bootstrap.apk | head -20

          sha256sum NX2-Switch2-Stage1C-B7-Controlled-Bootstrap.apk > SHA256SUMS-stage1c.txt
          {
            echo "Stage: 1C build 7 - process memory accounting"
            echo "Hard locked to title 040074a01bf12000 and Stage 1B.2 build IDs"
            echo "Maps and relocates main + sdk; validates but does not execute rtld"
            echo "Switch SVCs/unresolved imports stop as guarded BRK events"
            echo "Graphics/RomFS disabled"
            echo "Commit: $GITHUB_SHA"
          } > stage1c-build-info.txt

      - name: Upload Stage 1C APK
        uses: actions/upload-artifact@v4
        with:
          name: nx2-switch2-stage1c-${{ github.run_number }}
          path: |
            NX2-Switch2-Stage1C-B7-Controlled-Bootstrap.apk
            SHA256SUMS-stage1c.txt
            stage1c-build-info.txt
          if-no-files-found: error
          retention-days: 14
